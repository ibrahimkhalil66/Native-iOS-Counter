name: Native iOS build and UI test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on cloud macOS
    runs-on: macos-26-intel
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project CounterApp.xcodeproj

      - name: Find an available iPhone Simulator
        id: simulator
        run: |
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          import subprocess
          raw = subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "-j"
          ])
          data = json.loads(raw)
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device["name"].startswith("iPhone") and device.get("isAvailable", True):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator was found.")
          PY
          )
          echo "udid=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $SIMULATOR_ID"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project CounterApp.xcodeproj \
            -scheme CounterApp \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CounterApp-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/CounterApp.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CounterApp-Test-Results
          path: build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
