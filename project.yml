name: CounterApp
options:
  bundleIdPrefix: com.student
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CounterApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/CounterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.student.counterapp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  CounterAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CounterAppUITests
    dependencies:
      - target: CounterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.student.counterapp.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CounterApp:
    build:
      targets:
        CounterApp: all
    test:
      config: Debug
      targets:
        - CounterAppUITests